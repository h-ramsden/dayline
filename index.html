font-size:13px;margin-bottom:5px}.breaklabels span:last-child{color:var(--muted);font-size:12px}.meter{height:5px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{height:100%;display:block;background:var(--col)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:14px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding-bottom:8px;font-weight:700}.calcell{min-height:55px;border:1px solid var(--bg);border-radius:7px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}.outside{opacity:.42}.calcell small{font-size:9px;color:var(--accent)}.calcell .upcoming{color:var(--muted);font-size:8px;opacity:.7}.setting{min-height:49px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.setting span:first-of-type{flex:1;font-size:14px}.remove{border:0;background:none;color:#c85b52;font-size:23px;padding:5px 10px}.outline{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 13px;margin-top:12px;color:var(--accent);font-weight:650}.slot{padding:12px 0;border-bottom:1px solid var(--line)}.daysel{display:flex;gap:7px;margin-bottom:9px}.daysel button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;font-size:10px;color:var(--muted)}.daysel .on{background:var(--accent);color:white;border-color:var(--accent)}.timepair{display:flex;align-items:center;gap:8px}.field{min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg)}.modalbg{position:fixed;inset:0;background:#0008;z-index:8;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,430px);max-height:90dvh;overflow:auto;border-radius:18px;padding:20px;background:var(--card)}.modal h2{margin-bottom:9px}.modal label{display:block;margin:14px 0 6px}.formrow{display:flex;gap:8px}.formrow>*{flex:1;width:50%}.cancel{display:block;margin:9px auto 0;border:0;background:none;color:var(--muted);padding:8px}.note{border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--muted);font-size:12px;line-height:1.5;margin-top:17px}.footer{font-size:11px;line-height:1.5;color:var(--muted);margin-top:12px}.nav{position:sticky;bottom:0;z-index:3;display:flex;justify-content:space-around;align-items:center;min-height:65px;padding:6px 3px calc(6px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line)}.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;border:0;border-radius:11px;background:none;padding:6px 8px;color:var(--muted);font-size:10px;font-weight:650}.nav button span{font-size:16px;line-height:17px}.nav button.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--nav))}.notice{border-radius:11px;padding:11px;background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--muted);font-size:12px;line-height:1.5;margin-top:16px}.error{color:#a52f2f;background:#fff1f0;padding:12px;border-radius:10px;font:12px monospace;white-space:pre-wrap}.hidden{display:none!important}@media(min-width:650px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}main{padding:30px 34px 38px}.nav{max-width:680px;width:100%;margin:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.timeline-event.marker{padding:0;overflow:visible;background:transparent;border:0}.timeline-event.marker:before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--col) 18%,var(--card));border-left:3px solid var(--col);border-radius:6px;pointer-events:none}.timeline-event.marker b{position:absolute;left:calc(100% + 5px);top:0;z-index:2;width:max-content;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-left:2px solid var(--col);border-radius:5px;padding:2px 5px;font-size:10px;line-height:14px;box-shadow:0 1px 3px #0002}.week-event.marker b{left:2px;top:-17px}</style></head>
<body><div class="shell"><main id="screen"></main><nav class="nav" aria-label="Main navigation"><button data-view="Log"><span>●</span>Log</button><button data-view="Day"><span>▤</span>Day</button><button data-view="Week"><span>▥</span>Week</button><button data-view="Month"><span>▦</span>Month</button><button data-view="More"><span>•••</span>More</button></nav></div><div id="modal"></div>
<script>
const daylineScreen=document.querySelector('#screen');
daylineScreen.innerHTML='<p class="subtle">Loading Dayline…</p>';
window.addEventListener('error',event=>{daylineScreen.innerHTML='<div class="error"><strong>Dayline could not start</strong><br>'+String(event.message||'Unknown script error').replace(/[&<>]/g,'')+'</div>'});
window.addEventListener('unhandledrejection',event=>{daylineScreen.innerHTML='<div class="error"><strong>Dayline could not start</strong><br>'+String(event.reason||'Unexpected error').replace(/[&<>]/g,'')+'</div>'});
(()=>{
'use strict';const KEY='dayline.local.v1',COLORS=['#e99a76','#73a9a2','#8c91d8','#d1a652','#9c7bb2','#6e9dbf','#d4778a','#849c65','#c7815e','#78909c'];
const DEFAULTS=[['Phone','#d4778a'],['Gym','#73a9a2'],['School','#8c91d8'],['Chores','#d1a652'],['Bible','#9c7bb2']].map(([name,color])=>({id:name,name,color}));const DEFAULT_SCHEDULE={enabled:true,semesterEnd:'',slots:[{days:[1,3,5],start:'12:20',end:'15:20'},{days:[2,4],start:'11:00',end:'13:45'}]};
const pad=n=>String(n).padStart(2,'0'),id=()=>Date.now()+'-'+Math.random().toString(36).slice(2,8),dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),dateInput=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},timeInput=ms=>{const d=new Date(ms);return `${pad(d.getHours())}:${pad(d.getMinutes())}`},time=ms=>new Date(ms).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),short=ms=>new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'}),longDate=ms=>new Date(ms).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),duration=ms=>{let m=Math.max(0,Math.floor(ms/60000));return `${Math.floor(m/60)}h ${pad(m%60)}m`},esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let old={};try{old=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}let S={cats:old.cats||DEFAULTS,entries:old.entries||[],running:old.running||null,schedule:old.schedule||DEFAULT_SCHEDULE,theme:old.theme||'system',view:'Log',date:dayStart(new Date()),now:Date.now(),category:old.category||'Phone'};
const screen=document.querySelector('#screen'),modal=document.querySelector('#modal');const importInput=document.createElement('input');importInput.id='import-file';importInput.type='file';importInput.accept='application/json,.json';importInput.hidden=true;document.body.appendChild(importInput);function save(){localStorage.setItem(KEY,JSON.stringify({cats:S.cats,entries:S.entries,running:S.running,schedule:S.schedule,theme:S.theme,category:S.category}));theme()}
function theme(){S.dark=S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',S.dark)}matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.theme==='system')theme()});
function split(category,start,end,note='',source='timer'){const out=[];let t=start;while(t<end){let next=Math.min(end,new Date(new Date(t).getFullYear(),new Date(t).getMonth(),new Date(t).getDate()+1).getTime());out.push({id:id(),category,start:t,end:next,note,source});t=next}return out}
function classes(from,to){if(!S.schedule.enabled)return[];const out=[],d=new Date(dayStart(new Date(from)));for(;d.getTime()<to;d.setDate(d.getDate()+1)){const date=dateInput(d.getTime());if(S.schedule.semesterEnd&&date>S.schedule.semesterEnd)continue;for(const x of S.schedule.slots)if(x.days.includes(d.getDay())){const st=x.start.split(':').map(Number),en=x.end.split(':').map(Number);out.push({id:`class-${date}-${x.start}`,category:'School',start:new Date(d.getFullYear(),d.getMonth(),d.getDate(),st[0],st[1]).getTime(),end:new Date(d.getFullYear(),d.getMonth(),d.getDate(),en[0],en[1]).getTime(),source:'class',note:''})}}return out}
function entriesBetween(a,b){return [...S.entries.filter(x=>x.start<b&&x.end>a),...classes(a,b)]}function overlap(e,a,b){return Math.max(0,Math.min(e.end,b)-Math.max(e.start,a))}function total(a,b){return S.entries.filter(x=>x.start<b&&x.end>a).reduce((n,e)=>n+overlap(e,a,b),0)+classes(a,b).filter(e=>e.end<=S.now).reduce((n,e)=>n+overlap(e,a,b),0)}function categoryLabel(e){return e.source==='class'?'Class':e.category}function color(name){return S.cats.find(c=>c.name===name)?.color||(name==='Class'?S.cats.find(c=>c.name==='School')?.color:null)||'#8c91d8'}
function header(title,dt){let lbl=title==='Week'?`${short(dt)} – ${short(dt+6*86400000)}`:title==='Month'?new Date(dt).toLocaleDateString(undefined,{month:'long',year:'numeric'}):longDate(dt);return `<div class="navhead"><div><div class="eyebrow">${title.toUpperCase()}</div><h1>${esc(lbl)}</h1></div><div class="pager"><button data-act="move" data-n="-1" aria-label="Previous period">‹</button><button data-act="move" data-n="1" aria-label="Next period">›</button></div></div>`}
function entry(e){return `<div class="entry ${e.source==='class'&&e.end>S.now?'faded':''}" data-act="detail" data-id="${esc(e.id)}" style="--col:${color(e.category)}"><i class="ebar"></i><div class="emain"><div class="ename">${esc(categoryLabel(e))}</div><div class="emeta">${time(e.start)} – ${time(e.end)}${e.note?' · '+esc(e.note):''}</div></div><div class="edur">${duration(Math.max(0,Math.min(e.end,S.now)-e.start))}</div></div>`}
function logView(){const list=entriesBetween(dayStart(new Date()),dayStart(new Date())+86400000).sort((a,b)=>b.start-a.start).map(e=>entry(e)).join('');const pills=S.cats.map(c=>`<button class="chip ${S.category===c.name?'sel':''}" style="--col:${c.color}" data-act="category" data-name="${esc(c.name)}"><i class="dot"></i>${esc(c.name)}</button>`).join('');const watch=S.running?`<section class="timer"><div class="runlabel">NOW TRACKING</div><div class="runname">${esc(S.running.category)}</div><div class="digits">${duration(S.now-S.running.start)}</div><div class="timer-meta">${time(S.running.start)} · started ${Math.floor((S.now-S.running.start)/60000)} min ago</div><div class="actions"><button class="stop" data-act="stop">Stop &amp; save</button><button class="discard" data-act="discard">Discard</button></div></section>`:`<section class="card"><div class="label">WHAT ARE YOU DOING?</div><div class="chips">${pills}</div><button class="primary" data-act="start">Start stopwatch <span>↗</span></button></section>`;return `<div class="top"><div class="eyebrow">TODAY · ${short(S.now).toUpperCase()}</div><button class="more-link" data-view="More">•••</button></div><h1>Log your day</h1>${watch}<div class="section"><h2>Today</h2><button class="link" data-act="manual">+ Add time</button></div><p class="subtle">${duration(total(dayStart(new Date()),dayStart(new Date())+86400000))} logged</p>${list||'<div class="empty">Your day is a blank page.</div>'}`}
function timelineEvent(e,top,height,week=false,lane=0,lanes=1){const label=categoryLabel(e),start=time(e.start),end=time(e.end),marker=height<18||lanes>1,fullLabel=height>=46&&lanes===1,shortLabel=height>=18&&lanes===1,shown=week?`${label}, ${start} to ${end}`:`${label}, ${start} to ${end}, ${duration(e.end-e.start)}`,content=fullLabel?`<b>${esc(label)}</b><small>${start} – ${end}${week?'':' · '+duration(e.end-e.start)}</small>`:marker?`<b>${esc(label)} · ${start}</b>`:shortLabel?`<b>${esc(label)}</b>`:'';return `<button class="timeline-event ${week?'week-event ':''}${e.source==='class'&&e.end>S.now?'faded ':''}${fullLabel?'':'compact '}${marker?'marker':''}" data-act="detail" data-id="${esc(e.id)}" aria-label="${esc(shown)}" title="${esc(shown)}" style="--col:${color(label)};top:${top}px;height:${height}px;left:calc(${lane*100/lanes}% + 2px);width:calc(${100/lanes}% - 4px);right:auto">${content}</button>`}function timelineEvents(items,a,H,week=false){const sorted=items.map(e=>({e,start:Math.max(a,e.start),end:Math.min(a+86400000,e.end)})).sort((x,y)=>x.start-y.start||x.end-y.end),groups=[];let group=[],groupEnd=-Infinity;for(const x of sorted){if(group.length&&x.start>=groupEnd){groups.push(group);group=[];groupEnd=-Infinity}group.push(x);groupEnd=Math.max(groupEnd,x.end)}if(group.length)groups.push(group);return groups.map(g=>{const laneEnds=[],placed=g.map(x=>{let lane=laneEnds.findIndex(end=>end<=x.start);if(lane<0)lane=laneEnds.length;laneEnds[lane]=x.end;return{x,lane}}),lanes=laneEnds.length;return placed.map(({x,lane})=>timelineEvent(x.e,(x.start-a)/3600000*H,Math.max(2,(x.end-x.start)/3600000*H),week,lane,lanes)).join('')}).join('')}function dayView(){const a=dayStart(new Date(S.date)),b=a+86400000,H=64,items=entriesBetween(a,b).sort((x,y)=>x.start-y.start),hours=Array.from({length:24},(_,h)=>`<div class="day-hour" style="top:${h*H}px"><span>${new Date(a+h*3600000).toLocaleTimeString(undefined,{hour:'numeric'})}</span></div>`).join(''),blocks=timelineEvents(items,a,H),list=items.map(entry).join('');return `${header('Day',S.date)}<p class="subtle">${duration(total(a,b))} tracked · includes class time</p><div class="section"><h2>Entries</h2></div>${list||'<div class=empty>Nothing on this day yet.</div>'}<div class="section"><h2>Timeline</h2></div><div class="day-timeline">${hours}${blocks}</div>`}function monday(a){const d=new Date(a);return dayStart(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)))}
function breakdown(map,sum){return `<div class="breakdown">${[...map.entries()].sort((a,b)=>b[1]-a[1]).map(([name,val])=>`<div class="breakrow" style="--col:${color(name)}"><div class="breaklabels"><span>${esc(name)}</span><span>${duration(val)} · ${sum?Math.round(val/sum*100):0}%</span></div><div class="meter"><i style="width:${sum?Math.round(val/sum*100):0}%"></i></div></div>`).join('')||'<p class="subtle">Nothing logged in this range yet.</p>'}</div>`}
function weekView(){const a=monday(S.date),b=a+7*86400000,days=Array.from({length:7},(_,i)=>a+i*86400000),map=new Map();entriesBetween(a,b).filter(e=>e.source!=='class'||e.end<=S.now).forEach(e=>{const label=categoryLabel(e);map.set(label,(map.get(label)||0)+overlap(e,a,b))});let sum=[...map.values()].reduce((x,y)=>x+y,0),H=64,axis=Array.from({length:24},(_,h)=>`<div class='week-axis-hour' style='top:${h*H}px'>${new Date(a+h*3600000).toLocaleTimeString(undefined,{hour:'numeric'})}</div>`).join(''),heads=days.map(d=>`<div><b>${new Date(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</b><small>${duration(total(d,d+86400000))}</small></div>`).join(''),columns=days.map(d=>{const items=entriesBetween(d,d+86400000).sort((x,y)=>x.start-y.start);return `<div class='week-track'>${timelineEvents(items,d,H,true)}</div>`}).join('');return `${header('Week',a)}<div class='total'>${duration(sum)}</div><div class='subtle'>total tracked · includes class time</div><div class='days'>${days.map(d=>`<button class='daypill' data-act='open-day' data-date='${d}'><small>${new Date(d).toLocaleDateString(undefined,{weekday:'short'})}</small><strong>${new Date(d).getDate()}</strong><em>${duration(total(d,d+86400000))}</em></button>`).join('')}</div><div class='section'><h2>Category breakdown</h2></div>${breakdown(map,sum)}<div class='section'><h2>Week timeline</h2></div><div class='week-timeline-scroll'><div class='week-timeline'><div class='week-head'><div></div>${heads}</div><div class='week-axis'>${axis}</div><div class='week-columns'>${columns}</div></div></div>`}function monthView(){const dt=new Date(S.date),first=new Date(dt.getFullYear(),dt.getMonth(),1),offset=(first.getDay()+6)%7,a=dayStart(first)-offset*86400000,b=dayStart(new Date(dt.getFullYear(),dt.getMonth()+1,1)),days=Array.from({length:42},(_,i)=>a+i*86400000),all=entriesBetween(a,a+42*86400000),map=new Map(),bycat=new Map();all.filter(e=>e.source!=='class'||e.end<=S.now).forEach(e=>{const k=dayStart(new Date(e.start));map.set(k,(map.get(k)||0)+overlap(e,k,k+86400000));if(e.start>=dayStart(first)&&e.start<b)bycat.set(categoryLabel(e),(bycat.get(categoryLabel(e))||0)+overlap(e,dayStart(first),b))});const sum=[...bycat.values()].reduce((x,y)=>x+y,0);return `${header('Month',S.date)}<div class="calendar">${['M','T','W','T','F','S','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}${days.map(ms=>{const d=new Date(ms),future=classes(ms,ms+86400000).some(e=>e.end>S.now),v=map.get(ms)||0;return `<button class="calcell ${d.getMonth()!==dt.getMonth()?'outside':''}" data-act="open-day" data-date="${ms}">${d.getDate()}${v?`<small>${Math.floor(v/3600000)}h</small>`:''}${future?'<small class="upcoming">class</small>':''}</button>`}).join('')}</div><div class="section"><h2>Month breakdown</h2></div><p class="subtle">${duration(sum)} tracked · includes class time</p>${breakdown(bycat,sum)}`}
function moreView(){const catrows=S.cats.map(c=>`<div class="setting"><i class="dot" style="--col:${c.color}"></i><span>${esc(c.name)}</span><button class="remove" data-act="del-cat" data-id="${esc(c.id)}">×</button></div>`).join(''),week=['M','T','W','T','F','S','S'],num=[1,2,3,4,5,6,0],slotrows=S.schedule.slots.map((s,i)=>`<div class="slot"><div class="daysel">${num.map((d,j)=>`<button class="${s.days.includes(d)?'on':''}" data-act="toggle-day" data-slot="${i}" data-day="${d}">${week[j]}</button>`).join('')}</div><div class="timepair"><input class="field" type="time" value="${esc(s.start)}" data-act="slot-time" data-slot="${i}" data-key="start"><span class="subtle">to</span><input class="field" type="time" value="${esc(s.end)}" data-act="slot-time" data-slot="${i}" data-key="end"><button class="remove" data-act="del-slot" data-slot="${i}">×</button></div></div>`).join('');return `<h1>More</h1><section><div class="section"><h2>Categories</h2></div>${catrows}<button class="outline" data-act="add-cat">+ Add category</button></section><section><div class="section"><h2>Class schedule</h2></div><p class="subtle">Repeats weekly · class time counts after each class ends</p><div class="setting"><span>Include classes</span><input type="checkbox" data-act="schedule-enabled" ${S.schedule.enabled?'checked':''}></div>${slotrows}<button class="outline" data-act="add-slot">+ Add class time</button><div class="setting" style="margin-top:8px"><span>Semester ends</span><input class="field" type="date" data-act="semester" value="${esc(S.schedule.semesterEnd||'')}"></div></section><section><div class="section"><h2>Appearance &amp; data</h2></div><div class="setting"><span>Theme</span><select class="field" data-act="theme"><option value="system" ${S.theme==='system'?'selected':''}>Follow phone</option><option value="light" ${S.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.theme==='dark'?'selected':''}>Dark</option></select></div><button class="outline" data-act="export">Export log as JSON</button> <button class="outline" data-act="import">Import log from JSON</button><p class="footer">Data stays in this browser on this device. Export a backup before importing or clearing browser data.</p><div class="notice">The stopwatch uses its saved start time, so elapsed time stays accurate after closing the app. A standalone offline web app cannot schedule hourly iPhone alerts while closed. Background Web Push needs a server, which this local-only version does not use.</div></section>`}
function draw(){S.now=Date.now();theme();screen.innerHTML=S.view==='Log'?logView():S.view==='Day'?dayView():S.view==='Week'?weekView():S.view==='Month'?monthView():moreView();document.querySelectorAll('.nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view))}
function close(){modal.innerHTML=''}function modalBox(html){modal.innerHTML=`<div class="modalbg"><div class="modal">${html}<button class="cancel" data-act="close">Cancel</button></div></div>`}
function manualForm(){modalBox(`<h2>Add past time</h2><label class="label">CATEGORY</label><select id="mcat" class="field">${S.cats.map(c=>`<option ${c.name===S.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label class="label">DURATION · HOURS / MINUTES</label><div class="formrow"><input id="mh" class="field" type="number" min="0" placeholder="Hours" value="0"><input id="mm" class="field" type="number" min="0" max="59" placeholder="Minutes" value="30"></div><label class="label">END DATE · TIME</label><div class="formrow"><input id="md" class="field" type="date" value="${dateInput(Date.now())}"><input id="mt" class="field" type="time" value="${timeInput(Date.now())}"></div><label class="label">NOTE (OPTIONAL)</label><input id="mn" class="field" placeholder="Add a note" style="width:100%"><button class="primary" data-act="save-manual" style="margin-top:16px">Save entry</button>`)}
function confirmBox(title,message,label,fn){modalBox(`<h2>${title}</h2><p class="subtle">${message}</p><button class="outline" data-act="confirm">${label}</button>`);modal.querySelector('[data-act=confirm]').onclick=()=>{close();fn()}}
function detail(e){if(!e)return;modalBox(`<h2>${esc(categoryLabel(e))}</h2><p class="subtle">${longDate(e.start)}</p><h2>${time(e.start)} – ${time(e.end)}</h2><p class="subtle">${duration(e.end-e.start)}${e.source==='class'?' · scheduled class':''}</p>${e.note?`<p class="subtle">${esc(e.note)}</p>`:''}${e.source==='class'?'':`<button class="outline" style="color:#c85b52" data-act="delete-entry" data-id="${esc(e.id)}">Delete entry</button>`}`)}
function getEntry(idval){return S.entries.find(x=>x.id===idval)||classes(S.date-40*86400000,S.date+40*86400000).find(x=>x.id===idval)||classes(dayStart(new Date()),dayStart(new Date())+86400000).find(x=>x.id===idval)}
function act(e){const el=e.target.closest('[data-act],[data-view]');if(!el)return;if(el.dataset.view){S.view=el.dataset.view;draw();return}const a=el.dataset.act;switch(a){case'category':S.category=el.dataset.name;save();draw();break;case'start':if(!S.cats.length){S.view='More';draw();return}S.running={category:S.category,start:Date.now()};save();draw();break;case'stop':if(S.running){S.entries.push(...split(S.running.category,S.running.start,Date.now()));S.running=null;save();draw()}break;case'discard':confirmBox('Discard this session?','This time will not be saved.','Discard',()=>{S.running=null;save();draw()});break;case'manual':manualForm();break;case'save-manual':{const end=new Date(`${modal.querySelector('#md').value}T${modal.querySelector('#mt').value}`).getTime(),mins=Number(modal.querySelector('#mh').value||0)*60+Number(modal.querySelector('#mm').value||0);if(!Number.isFinite(end)||mins<1){alert('Choose a valid end time and duration.');return}S.entries.push(...split(modal.querySelector('#mcat').value,end-mins*60000,end,modal.querySelector('#mn').value,'manual'));save();close();draw();break}case'move':if(S.view==='Day')S.date+=Number(el.dataset.n)*86400000;else if(S.view==='Week')S.date+=Number(el.dataset.n)*7*86400000;else{const d=new Date(S.date);d.setMonth(d.getMonth()+Number(el.dataset.n));S.date=dayStart(d)}draw();break;case'open-day':S.date=Number(el.dataset.date);S.view='Day';draw();break;case'detail':detail(getEntry(el.dataset.id));break;case'delete-entry':S.entries=S.entries.filter(x=>x.id!==el.dataset.id);save();close();draw();break;case'add-cat':modalBox(`<h2>New category</h2><label class="label">CATEGORY NAME</label><input id="newcat" class="field" placeholder="For example, Reading" style="width:100%"><button class="primary" data-act="save-cat" style="margin-top:16px">Save category</button>`);modal.querySelector('#newcat').focus();break;case'save-cat':{const name=modal.querySelector('#newcat').value.trim();if(!name)return;if(S.cats.some(c=>c.name.toLowerCase()===name.toLowerCase())){alert('That category already exists.');return}S.cats.push({id:id(),name,color:COLORS[S.cats.length%COLORS.length]});S.category=name;save();close();draw();break}case'del-cat':{const c=S.cats.find(x=>x.id===el.dataset.id);if(c)confirmBox('Delete category?',`Past entries named “${c.name}” will stay in your log.`,'Delete',()=>{S.cats=S.cats.filter(x=>x.id!==c.id);if(S.category===c.name)S.category=S.cats[0]?.name||'';save();draw()});break}case'toggle-day':{const s=S.schedule.slots[Number(el.dataset.slot)],d=Number(el.dataset.day);if(s)s.days=s.days.includes(d)?s.days.filter(x=>x!==d):[...s.days,d];save();draw();break}case'add-slot':S.schedule.slots.push({days:[],start:'09:00',end:'10:00'});save();draw();break;case'del-slot':S.schedule.slots.splice(Number(el.dataset.slot),1);save();draw();break;case'export':exportData();break;case'import':document.querySelector('#import-file').click();break;case'close':close();break;case'delete-entry':S.entries=S.entries.filter(x=>x.id!==el.dataset.id);save();close();draw();break}}
screen.addEventListener('click',act);modal.addEventListener('click',e=>{if(e.target.classList.contains('modalbg'))close();else act(e)});document.querySelector('.nav').addEventListener('click',act);
document.addEventListener('change',e=>{const x=e.target,a=x.dataset.act;if(a==='theme'){S.theme=x.value;save();draw()}if(a==='schedule-enabled'){S.schedule.enabled=x.checked;save();draw()}if(a==='semester'){S.schedule.semesterEnd=x.value;save();draw()}if(a==='slot-time'){let s=S.schedule.slots[Number(x.dataset.slot)];if(s){s[x.dataset.key]=x.value;save()}}});
function exportData(){let data={version:1,cats:S.cats,entries:S.entries,running:S.running,schedule:S.schedule,theme:S.theme},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`dayline-${dateInput(Date.now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
document.querySelector('#import-file').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.cats)||!Array.isArray(v.entries))throw Error();if(confirm('Import will replace the data saved in this browser. Continue?')){S.cats=v.cats;S.entries=v.entries;S.running=v.running||null;S.schedule=v.schedule||DEFAULT_SCHEDULE;S.theme=v.theme||'system';save();draw()}}catch{alert('Choose a valid Dayline JSON export.')}e.target.value=''});
function refreshClock(){S.now=Date.now();if(S.view==='Log')draw()}setInterval(refreshClock,1000);window.addEventListener('pageshow',refreshClock);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshClock()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});draw();
})()
</script></body></html>
